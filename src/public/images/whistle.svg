<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <!-- Whistle main body (oval) -->
  <ellipse cx="100" cy="80" rx="45" ry="50" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  
  <!-- Whistle top curve -->
  <path d="M 70,50 Q 100,30 130,50" fill="#F5F5F5" stroke="#333333" stroke-width="2"/>
  
  <!-- Whistle mouth hole -->
  <ellipse cx="100" cy="60" rx="8" ry="12" fill="#333333"/>
  
  <!-- Whistle shine/highlight -->
  <ellipse cx="85" cy="70" rx="12" ry="15" fill="#F0F0F0" opacity="0.6"/>
  
  <!-- Whistle hole bottom -->
  <ellipse cx="100" cy="120" rx="25" ry="8" fill="#DDDDDD" stroke="#333333" stroke-width="1.5"/>
  
  <!-- Whistle sound waves (animated appearance) -->
  <g stroke="#0f5f42" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 60,80 Q 50,70 45,55" stroke-dasharray="3,3"/>
    <path d="M 140,80 Q 150,70 155,55" stroke-dasharray="3,3"/>
    <path d="M 100,130 L 100,155" stroke-width="2.5"/>
  </g>
  
  <!-- Decorative rings around whistle -->
  <circle cx="100" cy="80" r="55" fill="none" stroke="#0f5f42" stroke-width="1" opacity="0.3"/>
</svg>