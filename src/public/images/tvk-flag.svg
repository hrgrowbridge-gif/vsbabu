<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="300" height="150">
  <!-- Red top stripe -->
  <rect x="0" y="0" width="1200" height="200" fill="#CC0000"/>
  
  <!-- Yellow middle stripe -->
  <rect x="0" y="200" width="1200" height="200" fill="#FFD700"/>
  
  <!-- Red bottom stripe -->
  <rect x="0" y="400" width="1200" height="200" fill="#CC0000"/>
  
  <!-- Left elephant -->
  <g transform="translate(200, 300)">
    <!-- Elephant body -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#888888"/>
    <!-- Elephant head -->
    <circle cx="0" cy="-50" r="30" fill="#888888"/>
    <!-- Elephant ear -->
    <ellipse cx="-35" cy="-30" rx="25" ry="40" fill="#999999"/>
    <!-- Trunk up -->
    <path d="M -5,-55 Q -20,-80 -15,-100" stroke="#888888" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Tusk -->
    <path d="M 5,-40 L 25,-35" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Leg -->
    <rect x="-15" y="45" width="10" height="30" fill="#888888"/>
    <rect x="5" y="45" width="10" height="30" fill="#888888"/>
  </g>
  
  <!-- Center circle with star burst pattern -->
  <g transform="translate(600, 300)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="90" fill="#8B0000" stroke="#FFD700" stroke-width="3"/>
    
    <!-- Stars around circle -->
    <g fill="#FFD700">
      <circle cx="0" cy="-85" r="4"/><circle cx="30" cy="-78" r="4"/><circle cx="60" cy="-60" r="4"/><circle cx="78" cy="-30" r="4"/>
      <circle cx="85" cy="0" r="4"/><circle cx="78" cy="30" r="4"/><circle cx="60" cy="60" r="4"/><circle cx="30" cy="78" r="4"/>
      <circle cx="0" cy="85" r="4"/><circle cx="-30" cy="78" r="4"/><circle cx="-60" cy="60" r="4"/><circle cx="-78" cy="30" r="4"/>
      <circle cx="-85" cy="0" r="4"/><circle cx="-78" cy="-30" r="4"/><circle cx="-60" cy="-60" r="4"/><circle cx="-30" cy="-78" r="4"/>
    </g>
    
    <!-- Inner star burst -->
    <g fill="#FFD700" opacity="0.8">
      <path d="M 0,-40 L 4,-15 L 20,-10 L 8,0 L 10,20 L 0,10 L -10,20 L -8,0 L -20,-10 L -4,-15 Z"/>
      <circle cx="0" cy="0" r="8"/>
    </g>
  </g>
  
  <!-- Right elephant -->
  <g transform="translate(1000, 300)">
    <!-- Elephant body -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#888888"/>
    <!-- Elephant head -->
    <circle cx="0" cy="-50" r="30" fill="#888888"/>
    <!-- Elephant ear -->
    <ellipse cx="35" cy="-30" rx="25" ry="40" fill="#999999"/>
    <!-- Trunk up -->
    <path d="M 5,-55 Q 20,-80 15,-100" stroke="#888888" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Tusk -->
    <path d="M -5,-40 L -25,-35" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Leg -->
    <rect x="-15" y="45" width="10" height="30" fill="#888888"/>
    <rect x="5" y="45" width="10" height="30" fill="#888888"/>
  </g>
</svg>